<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐱 Cat Adventure 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#87ceeb;
 touch-action:none
}

#hud{
 position:fixed;
 top:12px;
 left:12px;
 z-index:10;
 background:#ffffffe8;
 padding:12px 15px;
 border-radius:18px;
 font-size:16px;
 line-height:1.7;
 box-shadow:0 3px 12px #0003
}

#message{
 position:fixed;
 top:12px;
 left:50%;
 transform:translateX(-50%);
 z-index:10;
 background:#ffffffe8;
 padding:10px 18px;
 border-radius:18px;
 font-weight:bold;
 text-align:center
}

#controls{
 position:fixed;
 bottom:15px;
 left:50%;
 transform:translateX(-50%);
 z-index:10;
 display:grid;
 grid-template-columns:65px 65px 65px;
 gap:7px
}

button{
 border:0;
 border-radius:18px;
 background:#ffffffdd;
 width:65px;
 height:58px;
 font-size:25px;
 box-shadow:0 3px 8px #0003
}

button:active{
 transform:scale(.9)
}

.empty{visibility:hidden}

#actions{
 position:fixed;
 right:15px;
 bottom:20px;
 z-index:10;
 display:flex;
 flex-direction:column;
 gap:8px
}

.action{
 width:65px;
 height:55px;
 font-size:14px
}

#screen{
 position:fixed;
 inset:0;
 z-index:30;
 background:#0009;
 display:none;
 align-items:center;
 justify-content:center;
 text-align:center;
 color:white
}

.card{
 background:#ffffffee;
 color:#222;
 padding:30px;
 border-radius:25px;
 min-width:280px;
 box-shadow:0 10px 40px #0006
}

.card h1{
 margin-top:0
}

.restart{
 background:#ff9f43;
 color:white;
 width:180px
}
</style>
</head>

<body>

<div id="hud">
🐱 Level: <span id="level">1</span><br>
🐟 Fish: <span id="fish">0</span>/<span id="target">10</span><br>
🪙 Coins: <span id="coins">0</span><br>
💎 Gems: <span id="gems">0</span><br>
❤️ Lives: <span id="lives">3</span>
</div>

<div id="message">Collect the fish! 🐟</div>

<div id="controls">
 <button class="empty"></button>
 <button onclick="move(0,-1)">⬆️</button>
 <button class="empty"></button>

 <button onclick="move(-1,0)">⬅️</button>
 <button onclick="move(0,1)">⬇️</button>
 <button onclick="move(1,0)">➡️</button>
</div>

<div id="actions">
 <button class="action" onclick="jump()">🦘 Jump</button>
 <button class="action" onclick="sprint()">⚡ Run</button>
 <button class="action" onclick="toggleNight()">🌙</button>
</div>

<div id="screen">
 <div class="card">
  <h1 id="endTitle">🎉 You Win!</h1>
  <p id="endText"></p>
  <button class="restart" onclick="restartGame()">🔄 Play Again</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   BASIC THREE.JS SETUP
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
 60,
 innerWidth/innerHeight,
 .1,
 500
);

const renderer = new THREE.WebGLRenderer({
 antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);


/* =========================
   LIGHT
========================= */

const sun = new THREE.DirectionalLight(
 0xffffff,
 2
);

sun.position.set(10,20,10);
sun.castShadow=true;

scene.add(sun);

scene.add(
 new THREE.HemisphereLight(
  0xffffff,
  0x557755,
  1
 )
);


/* =========================
   WORLD
========================= */

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(80,80),
 new THREE.MeshStandardMaterial({
  color:0x68ad50
 })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);


/* =========================
   ROAD
========================= */

const road = new THREE.Mesh(
 new THREE.PlaneGeometry(7,80),
 new THREE.MeshStandardMaterial({
  color:0x777777
 })
);

road.rotation.x=-Math.PI/2;
road.position.y=.01;

scene.add(road);


/* =========================
   CAT
========================= */

const cat = new THREE.Group();

const orange = new THREE.MeshStandardMaterial({
 color:0xf4a261
});

const dark = new THREE.MeshStandardMaterial({
 color:0x222222
});

const pink = new THREE.MeshStandardMaterial({
 color:0xff8fab
});


/* Body */

const body = new THREE.Mesh(
 new THREE.SphereGeometry(.75,16,16),
 orange
);

body.scale.set(1,.8,1.25);
body.castShadow=true;

cat.add(body);


/* Head */

const head = new THREE.Mesh(
 new THREE.SphereGeometry(.58,16,16),
 orange
);

head.position.y=.65;
head.castShadow=true;

cat.add(head);


/* Ears */

for(let x of [-.32,.32]){

 const ear = new THREE.Mesh(
  new THREE.ConeGeometry(.24,.55,4),
  orange
 );

 ear.position.set(x,1.12,0);
 ear.rotation.y=Math.PI/4;

 cat.add(ear);
}


/* Eyes */

for(let x of [-.2,.2]){

 const eye = new THREE.Mesh(
  new THREE.SphereGeometry(.075,10,10),
  dark
 );

 eye.position.set(x,.72,.5);

 cat.add(eye);
}


/* Nose */

const nose = new THREE.Mesh(
 new THREE.SphereGeometry(.07,10,10),
 pink
);

nose.position.set(0,.58,.55);

cat.add(nose);


/* Tail */

const tail = new THREE.Mesh(
 new THREE.TorusGeometry(.48,.09,8,20,Math.PI),
 orange
);

tail.position.set(0,.35,-.85);
tail.rotation.x=Math.PI/2;

cat.add(tail);


/* Cat position */

cat.position.set(0,.75,5);

scene.add(cat);


/* =========================
   OBJECT ARRAYS
========================= */

let fish=[];
let coins=[];
let gems=[];
let trees=[];
let enemies=[];
let particles=[];


/* =========================
   FISH
========================= */

function createFish(){

 const f = new THREE.Mesh(
  new THREE.SphereGeometry(.25,12,12),
  new THREE.MeshStandardMaterial({
   color:0xff7043,
   emissive:0x331100
  })
 );

 f.scale.x=1.6;

 f.position.set(
  Math.random()*60-30,
  .35,
  Math.random()*60-30
 );

 scene.add(f);
 fish.push(f);
}


/* =========================
   COINS
========================= */

function createCoin(){

 const c = new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.18,.06,16),
  new THREE.MeshStandardMaterial({
   color:0xffd700,
   metalness:.8
  })
 );

 c.rotation.x=Math.PI/2;

 c.position.set(
  Math.random()*60-30,
  .4,
  Math.random()*60-30
 );

 scene.add(c);
 coins.push(c);
}


/* =========================
   GEMS
========================= */

function createGem(){

 const g = new THREE.Mesh(
  new THREE.OctahedronGeometry(.3),
  new THREE.MeshStandardMaterial({
   color:0x00ffff,
   emissive:0x003333
  })
 );

 g.position.set(
  Math.random()*60-30,
  .5,
  Math.random()*60-30
 );

 scene.add(g);
 gems.push(g);
}


/* =========================
   TREES
========================= */

function createTree(x,z){

 const tree = new THREE.Group();

 const trunk = new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.25,1.5,8),
  new THREE.MeshStandardMaterial({
   color:0x8b5a2b
  })
 );

 trunk.position.y=.75;

 tree.add(trunk);


 const leaves = new THREE.Mesh(
  new THREE.SphereGeometry(1,12,12),
  new THREE.MeshStandardMaterial({
   color:0x238b45
  })
 );

 leaves.position.y=1.8;

 tree.add(leaves);

 tree.position.set(x,0,z);

 scene.add(tree);
 trees.push(tree);
}


/* =========================
   ENEMIES
========================= */

function createEnemy(){

 const dog = new THREE.Mesh(
  new THREE.SphereGeometry(.65,12,12),
  new THREE.MeshStandardMaterial({
   color:0x8b4513
  })
 );

 dog.position.set(
  Math.random()*50-25,
  .65,
  Math.random()*50-25
 );

 scene.add(dog);
 enemies.push(dog);
}


/* =========================
   CREATE WORLD
========================= */

for(let i=0;i<25;i++)createFish();

for(let i=0;i<25;i++)createCoin();

for(let i=0;i<8;i++)createGem();

for(let i=0;i<35;i++){

 let x=Math.random()*70-35;
 let z=Math.random()*70-35;

 if(Math.abs(x)>5)
  createTree(x,z);
}

for(let i=0;i<5;i++)
 createEnemy();


/* =========================
   GAME VARIABLES
========================= */

let fishCount=0;
let coinCount=0;
let gemCount=0;

let lives=3;
let level=1;

let target=10;

let speed=.65;

let jumping=false;
let sprinting=false;
let night=false;

document.getElementById("target").textContent=target;


/* =========================
   MOVEMENT
========================= */

function move(x,z){

 let s=sprinting?1.3:speed;

 cat.position.x+=x*s;
 cat.position.z+=z*s;

 cat.position.x=
 Math.max(-38,Math.min(38,cat.position.x));

 cat.position.z=
 Math.max(-38,Math.min(38,cat.position.z));

 if(x!==0)
  cat.rotation.y=x>0?Math.PI/2:-Math.PI/2;

 checkObjects();
}


/* =========================
   SPRINT
========================= */

function sprint(){

 sprinting=true;

 document.getElementById("message").textContent=
 "⚡ Kitty is running!";

 setTimeout(()=>{
  sprinting=false;
 },2500);
}


/* =========================
   JUMP
========================= */

function jump(){

 if(jumping)return;

 jumping=true;

 let start=Date.now();

 function animateJump(){

  let t=(Date.now()-start)/500;

  if(t<1){

   cat.position.y=.75+
   Math.sin(t*Math.PI)*2;

   requestAnimationFrame(animateJump);

  }else{

   cat.position.y=.75;
   jumping=false;
  }
 }

 animateJump();
}


/* =========================
   COLLISIONS
========================= */

function checkObjects(){

 /* Fish */

 fish.forEach(f=>{

  if(f.visible &&
     cat.position.distanceTo(f.position)<1){

   f.visible=false;

   fishCount++;

   document.getElementById("fish").textContent=
    fishCount;

   sparkle(f.position);

   if(fishCount>=target)
    nextLevel();
  }
 });


 /* Coins */

 coins.forEach(c=>{

  if(c.visible &&
     cat.position.distanceTo(c.position)<.8){

   c.visible=false;

   coinCount++;

   document.getElementById("coins").textContent=
    coinCount;

   sparkle(c.position);
  }
 });


 /* Gems */

 gems.forEach(g=>{

  if(g.visible &&
     cat.position.distanceTo(g.position)<.9){

   g.visible=false;

   gemCount++;

   document.getElementById("gems").textContent=
    gemCount;

   sparkle(g.position);
  }
 });


 /* Enemies */

 enemies.forEach(e=>{

  if(e.visible &&
     cat.position.distanceTo(e.position)<1.1){

   e.visible=false;

   lives--;

   document.getElementById("lives").textContent=
    lives;

   document.getElementById("message").textContent=
    "🐶 Oops! A dog got you!";

   if(lives<=0)
    gameOver();
  }
 });
}


/* =========================
   NEXT LEVEL
========================= */

function nextLevel(){

 level++;

 fishCount=0;

 target+=5;

 document.getElementById("level").textContent=
  level;

 document.getElementById("target").textContent=
  target;

 document.getElementById("fish").textContent=0;

 document.getElementById("message").textContent=
  "⭐ Level "+level+"! More fish!";

 for(let i=0;i<10;i++)
  createFish();

 speed+=.08;
}


/* =========================
   PARTICLES
========================= */

function sparkle(pos){

 for(let i=0;i<8;i++){

  const p=new THREE.Mesh(
   new THREE.SphereGeometry(.06,6,6),
   new THREE.MeshStandardMaterial({
    color:0xffff00
   })
  );

  p.position.copy(pos);

  p.userData={
   life:1,
   vx:(Math.random()-.5)*.1,
   vy:Math.random()*.12,
   vz:(Math.random()-.5)*.1
  };

  scene.add(p);
  particles.push(p);
 }
}


/* =========================
   DAY / NIGHT
========================= */

function toggleNight(){

 night=!night;

 if(night){

  scene.background=
   new THREE.Color(0x10152e);

  sun.intensity=.4;

  document.getElementById("message").textContent=
   "🌙 Night mode";

 }else{

  scene.background=
   new THREE.Color(0x87ceeb);

  sun.intensity=2;

  document.getElementById("message").textContent=
   "☀️ Day mode";
 }
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

 document.getElementById("screen").style.display=
  "flex";

 document.getElementById("endTitle").textContent=
  "💔 Game Over";

 document.getElementById("endText").textContent=
  "You collected "+coinCount+
  " coins and "+gemCount+" gems!";
}


/* =========================
   RESTART
========================= */

function restartGame(){

 location.reload();
}


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener("keydown",e=>{

 if(e.key==="ArrowUp"||e.key==="w")
  move(0,-1);

 if(e.key==="ArrowDown"||e.key==="s")
  move(0,1);

 if(e.key==="ArrowLeft"||e.key==="a")
  move(-1,0);

 if(e.key==="ArrowRight"||e.key==="d")
  move(1,0);

 if(e.key===" ")
  jump();
});


/* =========================
   ANIMATION
========================= */

function animate(){

 requestAnimationFrame(animate);


 /* Rotate collectibles */

 fish.forEach(f=>{

  if(f.visible)
   f.rotation.y+=.04;
 });

 coins.forEach(c=>{

  if(c.visible)
   c.rotation.z+=.08;
 });

 gems.forEach(g=>{

  if(g.visible){

   g.rotation.x+=.04;
   g.rotation.y+=.05;
  }
 });


 /* Enemy movement */

 enemies.forEach(e=>{

  if(!e.visible)return;

  let dx=cat.position.x-e.position.x;
  let dz=cat.position.z-e.position.z;

  let d=Math.sqrt(dx*dx+dz*dz);

  if(d<10){

   e.position.x+=(dx/d)*.025;
   e.position.z+=(dz/d)*.025;
  }
 });


 /* Particles */

 particles.forEach((p,i)=>{

  p.position.x+=p.userData.vx;
  p.position.y+=p.userData.vy;
  p.position.z+=p.userData.vz;

  p.userData.vy-=.005;
  p.userData.life-=.02;

  if(p.userData.life<=0){

   scene.remove(p);
   particles.splice(i,1);
  }
 });


 /* Camera follow */

 const targetCamera=new THREE.Vector3(
  cat.position.x,
  cat.position.y+7,
  cat.position.z+10
 );

 camera.position.lerp(targetCamera,.08);

 camera.lookAt(
  cat.position.x,
  cat.position.y,
  cat.position.z
 );


 /* Cat walking effect */

 if(!jumping){

  cat.position.y=
   .75+
   Math.sin(Date.now()/120)*.025;
 }

 renderer.render(scene,camera);
}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{

 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
 );
});

</script>

</body>
</html>
